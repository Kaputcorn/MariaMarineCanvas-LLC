<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>
        Mary's Marine Canvas
    </title>


    <meta
        name="description"
        content="Mary's Marine Canvas provides custom marine canvas, boat covers, enclosures, upholstery, and professional marine craftsmanship."
    >


    <!--
        Content Security Policy

        Google Fonts:
        fonts.googleapis.com = Google Fonts CSS
        fonts.gstatic.com = actual font files
    -->

    <meta
        http-equiv="Content-Security-Policy"
        content="
            default-src 'self';
            script-src 'self';
            style-src 'self' https://fonts.googleapis.com;
            font-src 'self' https://fonts.gstatic.com;
            img-src 'self' data:;
            connect-src 'self';
            object-src 'none';
            frame-src 'none';
            base-uri 'self';
            form-action 'self';
        "
    >


    <meta
        name="referrer"
        content="strict-origin-when-cross-origin"
    >


    <!-- Improve Google Fonts loading -->

    <link
        rel="preconnect"
        href="https://fonts.googleapis.com"
    >

    <link
        rel="preconnect"
        href="https://fonts.gstatic.com"
        crossorigin
    >


    <!-- LATO FONT -->

    <link
        href="https://fonts.googleapis.com/css2?family=Lato:ital,wght@0,300;0,400;0,700;0,900;1,400;1,700&display=swap"
        rel="stylesheet"
    >


    <!-- MAIN WEBSITE CSS -->

    <link
        rel="stylesheet"
        href="css/style.css"
    >


    <!-- LOADING SKELETON CSS -->

    <link
        rel="stylesheet"
        href="css/skeleton.css"
    >

</head>
